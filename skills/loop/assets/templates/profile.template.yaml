# Loop project profile — copy to <project>/docs/knowledge/profile.yaml and edit.
# Everything project-specific lives here; the loop engine stays identical for every repo.
schema: loop.profile.v1
project: "<project-name>"
target: "<one-sentence target description the loop is working on / optimizing>"
metric: "<the objective scalar/vector and how to read it>"
predicate: null         # optional success predicate; enables loop-completion when met

modes: [eval]           # allowed run modes; never list a forbidden/production mode

paths:
  loop: ".loop"                                # loop runtime state, plans, knowledge, scratch
  agents: ".agents"                            # native skills and on-demand subagent personas
  coverage: ".loop/coverage.json"
  knowledge: ".loop/knowledge"

boundaries:             # the fixed safety envelope the loop never weakens
  - "deterministic, reproducible execution"
  - "no look-ahead"
  - "all mandatory risk/safety gates enforced"

fronts:                 # coverage surface; names below are examples — use the project's own
  orient:   {required: true}
  discover: {required: true}
  audit:    {required: true}
  diagnose: {required: true, sub_axes: [<cell-or-metric>]}
  research: {required: false}
  debug:    {required: true, sub_axes: [<axis-a>, <axis-b>]}
  improve:  {required: true, sub_axes: [<axis-a>, <axis-b>]}
  harden:   {required: true}
  performance: {required: false}
  pipeline: {required: true}
  knowledge: {required: true}
  plan:     {required: true}

pipeline:               # canonical ordered stages (see references/pipeline-contract.md)
  - {id: evaluate, kind: evaluate, command: "<cli>", artifact: "<path>"}
  - {id: diagnose, kind: diagnose, command: "<cli>", artifact: "<path>"}
  # ... acquire / evidence / experiment / record / view

gates:
  objective: "<how a candidate is shown to advance the target>"
  invariants: "<test/lint/type commands that must remain green>"

completion:
  rule: "<target criteria met | coverage complete | budget>"
  require_coverage: true
  require_delivery: true
