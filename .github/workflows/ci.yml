name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Check portable release structure
        run: python -B tools/check_release.py
      - name: Test staged configuration changes and recovery
        run: python -B -m unittest discover -s skills/characterize/scripts -p "test_*.py" -v
      - name: Test incremental review ledger
        run: python -B -m unittest discover -s skills/enhance/scripts -p "test_*.py" -v
      - name: Test audit artifact contract
        run: python -B -m unittest discover -s skills/audit/scripts -p "test_*.py" -v
      - name: Test knowledge base validator
        run: python -B -m unittest discover -s skills/knowledge/scripts -p "test_*.py" -v
      - name: Test explicit installation and OHP conformance
        run: python -B -m unittest discover -s tests -p "test_*.py" -v
      - name: Test autonomous loop engine scripts
        run: python -B -m unittest discover -s skills/loop/scripts -p "test_*.py" -v
