[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openharness"
version = "0.2.0"
description = "The deterministic control plane for agent harnesses: declare, lock, measure, prove."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "seismael" }]
keywords = [
  "agents",
  "agent-harness",
  "context-engineering",
  "evaluation",
  "governance",
  "deterministic",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.13",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.9",
]

[project.scripts]
openharness = "openharness.cli:main"

[project.urls]
Homepage = "https://github.com/seismael/openharness"
Documentation = "https://github.com/seismael/openharness/blob/main/docs/QUICKSTART.md"
Repository = "https://github.com/seismael/openharness"
Changelog = "https://github.com/seismael/openharness/blob/main/CHANGELOG.md"
Issues = "https://github.com/seismael/openharness/issues"

[tool.setuptools]
package-dir = { "" = "skills/loop/scripts" }

[tool.setuptools.packages.find]
where = ["skills/loop/scripts"]
include = ["openharness", "openharness.*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --import-mode=importlib"
testpaths = [
  "tests",
  "skills/characterize/scripts",
  "skills/enhance/scripts",
  "skills/audit/scripts",
  "skills/knowledge/scripts",
  "skills/loop/scripts",
]
pythonpath = [
  ".",
  "skills/loop/scripts",
  "skills/audit/scripts",
  "skills/characterize/scripts",
  "skills/enhance/scripts",
  "skills/knowledge/scripts",
]

[tool.coverage.run]
source = ["openharness"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["openharness"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
files = ["skills/loop/scripts/openharness"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
strict_equality = true
